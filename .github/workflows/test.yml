name: Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # Allows manual triggering from the Actions tab in GitHub UI
  workflow_dispatch: 

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install uv
      run: curl -LsSf https://astral.sh/uv/install.sh | sh
    - name: Add uv to PATH
      run: echo "$HOME/.cargo/bin" >> $GITHUB_PATH

    - name: Create Virtual Environment using uv
      run: uv venv .venv

    - name: Install Dependencies using uv
      run: |
        # Install main/dev dependencies + test dependencies
        uv pip install -e ".[dev]" pytest pytest-asyncio
        # Download NLTK data using the Python in the venv
        uv run python -m nltk.downloader punkt stopwords

    - name: Run tests using uv run
      run: |
        # Use 'uv run' to execute pytest within the environment
        uv run pytest tests/ -v --log-level=INFO
      env:
        DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        # PYTHONPATH may not be strictly necessary when using 'uv run' but can be kept for safety
        PYTHONPATH: ${{ github.workspace }}
