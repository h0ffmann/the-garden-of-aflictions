site_name: Obsidian Analyzer
nav:
  - Home: index.md
  - Getting Started: docs/getting_started.md
  - Architecture: docs/architecture.md
  - Commands: docs/commands.md
  - CI/CD: docs/cicd.md 
  - Local Setup: docs/running_locally.md
  - Requirements: docs/requirements.md
  - Testing: docs/tests.md
  - API: docs/api_reference.md
  - Development: docs/development.md
  - Examples:
    - Sample Analysis: docs/examples/sample_analysis.md
  - Prompts:
    - Overview: docs/prompts/overview.md
    - Tone Analysis: docs/prompts/analyze_tone_en.md
    - Concept Mapping: docs/prompts/concepts_map_pt.md
    - Metaphor Analysis: docs/prompts/metaphor_analysis_en.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/your/repo

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.indexes

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: "google"
            show_root_heading: true
            show_root_full_path: false
  - autorefs:
      link_titles: false

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.highlight
