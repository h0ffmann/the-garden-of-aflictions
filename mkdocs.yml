site_name: Obsidian Analyzer
nav:
  - Home: index.md
  - Getting Started: getting_started.md
  - Architecture: architecture.md
  - Commands: commands.md
  - CI/CD: cicd.md 
  - Local Setup: running_locally.md
  - Requirements: requirements.md
  - Testing: tests.md
  - API: api_reference.md
  - Development: development.md
  - Examples:
    - Sample Analysis: examples/sample_analysis.md
  - Prompts:
    - Overview: prompts/overview.md
    - Tone Analysis: prompts/analyze_tone_en.md
    - Concept Mapping: prompts/concepts_map_pt.md
    - Metaphor Analysis: prompts/metaphor_analysis_en.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/your/repo

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.indexes

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: "google"
            show_root_heading: true
            show_root_full_path: false
  - autorefs:
      link_titles: false

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.highlight
