[project]
name = "obsidian_analyzer"
version = "0.1.0"
description = "Philosophical text analysis tool for Obsidian"
authors = [
    {name = "Your Name", email = "your@email.com"},
]
dependencies = [
    "python-dotenv>=1.0.1",
    "pypdf>=4.2.0",  # Primary PDF reader
    "PyPDF2>=3.0.0",  # Fallback PDF reader
    "nltk>=3.8.1",
    "matplotlib>=3.8.0",
    "wikipedia>=1.4.0",
    "aiofiles>=23.2.1",
    "langchain>=0.1.16",
    "langchain-openai>=0.1.3",
]
requires-python = ">=3.12"

[project.scripts]
obsidian-analyzer = "obsidian_analyzer.main:main"

[tool.setuptools.packages.find]
where = ["."]  # Look for packages in root directory

[project.optional-dependencies]
docs = [
    "mkdocs>=1.4.0,<2.0.0",
    "mkdocs-material>=9.0.0,<10.0.0",
    "mkdocstrings[python]>=0.24.0,<1.0.0",
    "mkdocs-autorefs>=1.0.0,<2.0.0"
]
dev = [
    "black==24.3.0",
    "isort==5.13.2",
    "flake8==7.0.0",
    "mypy==1.9.0",
    "ruff==0.4.4",
    "pytest==8.1.1",
    "pytest-asyncio==0.23.7",
    "pytest-cov==4.1.0",
    "pytest-mock==3.14.0",
    "mkdocs==1.5.3",
    "mkdocs-material==9.5.3",
]

[build-system]
requires = ["setuptools>=65.5.1", "wheel>=0.38.4"]
build-backend = "setuptools.build_meta"
