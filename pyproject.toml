[project]
name = "obsidian_analyzer"
version = "0.1.0"
description = "Philosophical text analysis tool for Obsidian"
authors = [
    {name = "Your Name", email = "your@email.com"},
]
dependencies = [
    "langchain-openai>=0.1.0",
    "python-dotenv>=1.0.0",
    "PyPDF2>=3.0.0",
    "nltk>=3.8.0",
    "matplotlib>=3.7.0",
    "wikipedia>=1.4.0",
    "aiofiles>=23.2.0",
]
requires-python = ">=3.10"

[project.scripts]
obsidian-analyzer = "obsidian_analyzer.main:main"

[tool.uv]
pip-version = "24.0"
resolution = "highest"
