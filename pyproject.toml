[project]
name = "obsidian_analyzer"
version = "0.1.0"
description = "Philosophical text analysis tool for Obsidian"
authors = [
    {name = "Your Name", email = "your@email.com"},
]
dependencies = [
    "python-dotenv>=1.0.1",
    "pypdf>=4.2.0",  # Replacing PyPDF2 which is deprecated
    "nltk>=3.8.1",
    "matplotlib>=3.8.0",
    "wikipedia>=1.4.0",
    "aiofiles>=23.2.1",
    "httpx>=0.27.0",
    "langchain>=0.1.16",
    "langchain-openai>=0.1.3",
]
requires-python = ">=3.12"

[project.scripts]
obsidian-analyzer = "obsidian_analyzer.main:main"

[tool.setuptools.packages.find]
where = ["."]  # Look for packages in root directory

[project.optional-dependencies]
dev = [
    "black==24.3.0",
    "isort==5.13.2",
    "flake8==7.0.0",
    "mypy==1.9.0",
    "ruff==0.4.4",
]

[build-system]
requires = ["setuptools>=65.5.1", "wheel>=0.38.4"]
build-backend = "setuptools.build_meta"
